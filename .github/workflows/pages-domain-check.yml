# Диагностика кастомного домена с раннера GitHub.
#
# Изнутри контейнера разработки этого не проверить: путь API закрыт прокси,
# а DNS-запросы перехватывает локальный резолвер — авторитетные ответы
# до него не доходят. Только чтение, ничего не меняет.
name: Pages domain check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/upbeat-mayer-x9s57t
    paths:
      - '.github/workflows/pages-domain-check.yml'

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOMAIN: forvide.ru
      OWNER: dntsstudio-ai
    steps:
      - name: Состояние Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/pages" | jq .

      - name: Записи домена
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          for ns in ns1.reg.ru ns2.reg.ru; do
            echo "=== $ns ==="
            dig +norecurse SOA "$DOMAIN" @"$ns" | sed -n '/flags:/p'
            echo "A:    $(dig +norecurse +short A "$DOMAIN" @"$ns" | tr '\n' ' ')"
            echo "AAAA: $(dig +norecurse +short AAAA "$DOMAIN" @"$ns" | tr '\n' ' ')"
            echo "www:  $(dig +norecurse +short A "www.$DOMAIN" @"$ns" | tr '\n' ' ')"
            echo "CAA:  $(dig +norecurse +short CAA "$DOMAIN" @"$ns" | tr '\n' ' ')"
          done

      - name: Сертификат на домене
        run: |
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -dates 2>/dev/null \
            || echo 'сертификат не получен'

      # Главный вопрос. Если у репозитория задан кастомный домен, GitHub
      # перенаправляет его адрес вида owner.github.io/repo на этот домен.
      # Так видно чужую привязку, не имея доступа к настройкам того
      # репозитория: второй репозиторий с тем же доменом — известная
      # причина, по которой проверка DNS висит, а сертификат не заказывается.
      - name: Не держит ли домен другой репозиторий
        run: |
          for repo in ForVideTest1 Yandex-game1 gre32 JiluQwer JISr3 \
                      Lnyxtdrse-Donq renascendyvoice SoundWaveStudio.dub; do
            out=$(curl -sS -o /dev/null -D- --max-time 20 \
              "https://$OWNER.github.io/$repo/" 2>/dev/null || true)
            code=$(printf '%s' "$out" | sed -n '1s/.* \([0-9]\{3\}\) .*/\1/p')
            loc=$(printf '%s' "$out" | grep -i '^location:' | tr -d '\r' || true)
            printf '%-24s %s  %s\n' "$repo" "${code:-нет}" "${loc:-без перенаправления}"
          done
          echo "--- корень $OWNER.github.io ---"
          curl -sS -o /dev/null -D- --max-time 20 "https://$OWNER.github.io/" 2>/dev/null \
            | grep -iE '^(HTTP/|location:)' | tr -d '\r' || echo 'нет ответа'
