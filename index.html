<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="description"
      content="КРАСНЫЙ ФЛАГ — короткая браузерная игра о выявлении коррупционных рисков в документах."
    />
    <title>КРАСНЫЙ ФЛАГ</title>
    <style>
      /* Заставка до загрузки скриптов: без неё сбой выглядел бы как белый экран. */
      html,
      body {
        margin: 0;
        background: #0a0c11;
      }

      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .boot-title {
        margin: 0;
        font-size: 1.3rem;
        letter-spacing: 0.14em;
        color: #ff4d55;
      }

      .boot-text {
        margin: 0;
        max-width: 42ch;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #98a1b3;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot">
        <p class="boot-title">КРАСНЫЙ ФЛАГ</p>
        <p class="boot-text">Загрузка…</p>
      </div>
    </div>

    <script>
      // Если скрипт или стиль не загрузился, показываем причину вместо пустой страницы.
      window.addEventListener(
        'error',
        function (event) {
          var text = document.querySelector('.boot-text');
          if (!text) return;
          var target = event.target;
          var source = target && target.src ? target.src : target && target.href ? target.href : '';
          text.textContent = source
            ? 'Не удалось загрузить файл: ' + source
            : 'Ошибка при запуске: ' + (event.message || 'неизвестная причина');
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
