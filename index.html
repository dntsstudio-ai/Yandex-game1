<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="description"
      content="КРАСНЫЙ ФЛАГ — короткая браузерная игра о выявлении коррупционных рисков в документах."
    />
    <title>КРАСНЫЙ ФЛАГ</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Превью при отправке ссылки. Абсолютный адрес нужен краулерам соцсетей. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="КРАСНЫЙ ФЛАГ" />
    <meta property="og:title" content="КРАСНЫЙ ФЛАГ — игра о противодействии коррупции" />
    <meta
      property="og:description"
      content="Десять документов, таймер на каждый. Найдите признаки коррупционного риска и решите: пропустить или остановить."
    />
    <meta property="og:image" content="https://dntsstudio-ai.github.io/Yandex-game1/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Фон меню грузится первым: это первый экран игры. -->
    <link rel="preload" as="image" href="./media/menu/headquarters.webp" />

    <!-- Шрифты интерфейса и документов. Если сеть недоступна, подставятся системные. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Заставка до загрузки скриптов: без неё сбой выглядел бы как белый экран. */
      html,
      body {
        margin: 0;
        background: #0a0c11;
      }

      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .boot-title {
        margin: 0;
        font-size: 1.3rem;
        letter-spacing: 0.14em;
        color: #ff4d55;
      }

      .boot-text {
        margin: 0;
        max-width: 42ch;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #98a1b3;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot">
        <p class="boot-title">КРАСНЫЙ ФЛАГ</p>
        <p class="boot-text">Загрузка…</p>
      </div>
    </div>

    <script>
      // Если скрипт или стиль не загрузился, показываем причину вместо пустой страницы.
      window.addEventListener(
        'error',
        function (event) {
          var text = document.querySelector('.boot-text');
          if (!text) return;
          var target = event.target;
          var source = target && target.src ? target.src : target && target.href ? target.href : '';
          text.textContent = source
            ? 'Не удалось загрузить файл: ' + source
            : 'Ошибка при запуске: ' + (event.message || 'неизвестная причина');
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
